<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .page-header::after {
            content: 'MUSIC';
            position: absolute;
            right: -10px; top: 50%;
            transform: translateY(-50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(80px, 14vw, 200px);
            color: transparent;
            -webkit-text-stroke: 1px rgba(232,0,13,0.1);
            pointer-events: none;
            letter-spacing: 10px;
            line-height: 1;
            user-select: none;
        }

        /* Loading Spinner Styles */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loader-overlay.active { opacity: 1; pointer-events: all; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .track-count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 500px;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: var(--grey);
            font-weight: 600;
            animation: fadeUp 0.7s 0.2s ease both;
        }
        .track-count span { color: var(--red); font-family: 'Share Tech Mono', monospace; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* GRID */
        .music-container {
            padding: 48px 60px 80px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .featured-track {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
            gap: 0;
            margin-bottom: 34px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            animation: fadeUp 0.7s 0.25s ease both;
        }
        .featured-track::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 2px;
            background: var(--red);
            z-index: 2;
        }
        .featured-video {
            background: var(--deep);
            aspect-ratio: 16 / 9;
        }
        .featured-video iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .featured-info {
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
            border-left: 1px solid var(--border);
        }
        .featured-kicker,
        .track-kicker,
        .section-label {
            font-family: 'Share Tech Mono', monospace;
            color: var(--red);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .featured-info h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(44px, 5vw, 72px);
            letter-spacing: 4px;
            line-height: 0.9;
            margin: 12px 0 14px;
        }
        .featured-info p {
            color: var(--grey);
            font-size: 18px;
            line-height: 1.5;
        }
        .featured-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border: 1px solid var(--border);
            background: var(--border);
            gap: 1px;
        }
        .featured-stats div {
            background: var(--deep);
            padding: 13px 14px;
        }
        .featured-stats span {
            display: block;
            color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .featured-stats strong {
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            margin: 0 0 18px;
            padding-top: 8px;
        }
        .section-heading h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(34px, 5vw, 58px);
            letter-spacing: 4px;
            line-height: 0.9;
        }
        .section-heading p {
            color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .song-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transition: all 0.25s ease;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }
        .card:nth-child(1)  { animation-delay: 0.05s; }
        .card:nth-child(2)  { animation-delay: 0.10s; }
        .card:nth-child(3)  { animation-delay: 0.15s; }
        .card:nth-child(4)  { animation-delay: 0.20s; }
        .card:nth-child(5)  { animation-delay: 0.25s; }
        .card:nth-child(6)  { animation-delay: 0.30s; }
        .card:nth-child(7)  { animation-delay: 0.35s; }
        .card:nth-child(8)  { animation-delay: 0.40s; }
        .card:nth-child(9)  { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.50s; }
        .card:nth-child(11) { animation-delay: 0.55s; }
        .card:nth-child(12) { animation-delay: 0.60s; }
        .card:nth-child(13) { animation-delay: 0.65s; }
        .card:nth-child(14) { animation-delay: 0.70s; }

        .card:hover {
            border-color: var(--red-dim);
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 32px var(--red-glow);
        }

        /* Card Distort Effect on Hover */
        .card:hover iframe {
            filter: contrast(1.2) brightness(1.1);
            animation: card-shake 0.2s infinite;
        }
        @keyframes card-shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* red top flash on hover */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--red);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
            z-index: 2;
        }
        .card:hover::before { transform: scaleX(1); }

        .card iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: none;
            display: block;
        }
        .track-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: var(--deep);
            border-top: 1px solid var(--border);
        }
        .track-label span {
            color: var(--red);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
        }
        .track-label strong {
            color: var(--grey);
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* FOOTER BAR */
        .footer-bar {
            border-top: 1px solid var(--border);
            padding: 40px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--deep);
        }
        .footer-bar .logo-sm {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 4px;
            color: var(--dim);
        }
        .footer-bar .socials { display: flex; gap: 10px; flex-wrap: wrap; }
        .footer-bar .socials a {
            text-decoration: none;
            color: var(--dim);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 500px;
            transition: all 0.2s;
        }
        .footer-bar .socials a:hover {
            color: var(--white);
            border-color: var(--red);
            box-shadow: 0 0 12px var(--red-glow);
        }

        /* Search Styles */
        .search-container {
            position: relative;
            margin-top: 24px;
            max-width: 400px;
            animation: fadeUp 0.7s 0.3s ease both;
        }

        #search-input {
            width: 100%;
            background: var(--deep);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 45px 14px 20px;
            color: var(--white);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 15px var(--red-glow);
        }

        .clear-search-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--dim);
            font-size: 22px;
            cursor: pointer;
            display: none;
            line-height: 1;
            transition: color 0.2s;
        }
        .clear-search-btn:hover { color: var(--red); }

        /* Filter Styles */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            animation: fadeUp 0.7s 0.35s ease both;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            padding: 6px 16px;
            border-radius: 500px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { border-color: var(--grey); color: var(--grey); }
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--grey);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .share-btn:hover {
            border-color: var(--red);
            color: var(--white);
            background: rgba(232, 0, 13, 0.1);
        }

        /* Pagination Controls */
        .pagination-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .pagination-button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--grey);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .pagination-button:hover:not(:disabled) {
            border-color: var(--red);
            color: var(--white);
            background: rgba(232, 0, 13, 0.1);
        }

        .pagination-button.active {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
            cursor: default;
        }

        .pagination-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .navbar { padding: 0 20px; }
            .page-header { padding: 48px 24px 32px; }
            .music-container { padding: 32px 20px 60px; }
            .featured-track { grid-template-columns: 1fr; }
            .featured-info { border-left: 0; border-top: 1px solid var(--border); padding: 22px; }
            .section-heading { align-items: start; flex-direction: column; }
            .song-container { grid-template-columns: 1fr; gap: 14px; }
            .footer-bar { padding: 32px 20px; }
        }
        @media (max-width: 480px) {
            .navbar ul { gap: 0; }
            .navbar ul li a { padding: 8px 10px; font-size: 12px; }
        }

        /* CRT Scanlines & Vignette Overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9998;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
            z-index: 9999;
            pointer-events: none;
        }

        /* Glitch Effect Styles */
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--deep);
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(30% 0 10% 0); }
            50% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(50% 0 30% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 50% 0); }
            50% { clip-path: inset(70% 0 10% 0); }
            100% { clip-path: inset(20% 0 60% 0); }
        }
        .glitch:hover::before { animation-duration: 0.1s; }
        .glitch:hover::after { animation-duration: 0.1s; }

        /* Screen Glitch Spike */
        .active-glitch {
            animation: screen-spike 0.1s steps(2);
        }
        @keyframes screen-spike {
            0% { filter: invert(0.5) hue-rotate(90deg); transform: translateX(5px) skewX(2deg); }
            50% { filter: contrast(5); transform: translateX(-5px) skewX(-2deg); }
            100% { filter: none; transform: none; }
        }
    </style>
</head>

    <script>
        // ข้อมูล trackList ถูกโหลดมาจากไฟล์ data.js แล้ว
        
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentMode = 'ALL';
        let filteredTracks = [...trackList]; // เก็บรายการเพลงที่ผ่านการกรองแล้ว

        let audioCtx;
        function playStaticPop() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = audioCtx.sampleRate * 0.1; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            filter.Q.value = 1;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
            noise.stop(audioCtx.currentTime + 0.1);
        }

        function triggerScreenGlitch() {
            document.body.classList.add('active-glitch');
            setTimeout(() => {
                document.body.classList.remove('active-glitch');
            }, 100);
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('button, a')) {
                playStaticPop();
                triggerScreenGlitch();
            }
        });

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = Math.floor(progress * (end - start) + start);
                obj.textContent = value.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        async function loadStats() {
            try {
                const response = await fetch('https://api.counterapi.dev/v1/lilmhxqzx/music/up');
                const data = await response.json();
                animateValue('visitor-val', 0, data.count, 1500);
            } catch (err) {
                document.getElementById('visitor-val').textContent = 'OFFLINE';
            }
        }

        // ฟังก์ชันสร้าง UI เมื่อไม่พบผลลัพธ์
        function getEmptyStateHTML() {
            return `
                <div style="grid-column: 1/-1; text-align: center; padding: 100px 20px; border: 1px dashed var(--border); border-radius: 10px; background: rgba(255,255,255,0.02); animation: fadeUp 0.5s ease;">
                    <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.2;">🚫</div>
                    <h3 style="font-family: 'Bebas Neue'; font-size: 32px; color: var(--red); letter-spacing: 2px;">NO MATCHES FOUND</h3>
                    <p style="color: var(--dim); font-family: 'Share Tech Mono'; margin-top: 10px; text-transform: uppercase;">The frequency you are looking for does not exist in our database.</p>
                </div>
            `;
        }

        async function shareTrack(title, id) {
            const url = `https://www.youtube.com/watch?v=${id}`;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: `Lilmhxqzx - ${title}`,
                        text: `Check out this track by Lilmhxqzx: ${title}`,
                        url: url
                    });
                } catch (err) {
                    console.log('Share cancelled or failed');
                }
            } else {
                navigator.clipboard.writeText(url);
                alert('Link copied to clipboard!');
            }
        }

        function renderMusic(page = 1) {
            currentPage = page;
            const featuredRoot = document.getElementById('featured-root');
            const catalogRoot = document.getElementById('catalog-root');
            const totalTracksEl = document.getElementById('total-tracks');
            const remainingCountEl = document.getElementById('remaining-count');
            const paginationControls = document.getElementById('pagination-controls');

            if (!filteredTracks.length) {
                featuredRoot.innerHTML = '';
                catalogRoot.innerHTML = getEmptyStateHTML();
                totalTracksEl.textContent = '0';
                remainingCountEl.textContent = '0 results';
                paginationControls.innerHTML = '';
                return;
            }

            // Update Total Count (ตามผลการค้นหา)
            totalTracksEl.textContent = filteredTracks.length;

            // 1. Render Featured Track (เพลงแรกจากรายการที่กรองแล้ว)
            const featured = filteredTracks[0];
            
            // Update Page Background based on Featured Track
            // ปิดการทำงานส่วนนี้เพื่อให้พื้นหลังเป็นรูป music-bg.jpg ตามที่ตั้งค่าใน CSS
            // const bgLayer = document.getElementById('music-bg-layer');
            // if (bgLayer && featured.coverSrc) {
            //     bgLayer.style.backgroundImage = `url('${featured.coverSrc}')`;
            // }

            featuredRoot.innerHTML = `
                <section class="featured-track" aria-label="Featured track">
                    <div class="featured-video">
                        <iframe src="https://www.youtube.com/embed/${featured.id}" 
                                title="YouTube video player" frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen></iframe>
                    </div>
                    <div class="featured-info">
                        <div>
                            <div class="featured-kicker">LATEST RELEASE</div>
                            <h2>${featured.title}</h2>
                            <p>${featured.description || 'Check out my newest sound.'}</p>
                            <button class="share-btn" style="margin-top: 15px; align-self: flex-start;" onclick="shareTrack('${featured.title.replace(/'/g, "\\'")}', '${featured.id}')">SHARE TRACK</button>
                        </div>
                        <div class="featured-stats">
                            <div>
                                <span>Status</span>
                                <strong>NEWEST</strong>
                            </div>
                            <div>
                                <span>Mode</span>
                                <strong>${featured.mode || 'Heavy'}</strong>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            // 2. Render Catalog (เพลงที่เหลือ)
            const catalogTracks = filteredTracks.slice(1); 
            const totalCatalogTracks = catalogTracks.length;
            const totalPages = Math.ceil(totalCatalogTracks / itemsPerPage);

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalCatalogTracks); // Ensure endIndex doesn't exceed array length

            const paginatedTracks = catalogTracks.slice(startIndex, endIndex);

            const catalogHtml = paginatedTracks.map((track, index) => {
                // Calculate track number relative to the *entire* catalog, not just the current page
                const actualTrackNumber = startIndex + index + 2; // +1 for 0-indexing, +1 for featured track
                const trackNumber = actualTrackNumber.toString().padStart(2, '0');
                
                return `
                    <div class="card" style="animation-delay: ${0.05 * (index + 1)}s">
                        <iframe src="https://www.youtube.com/embed/${track.id}" 
                                title="YouTube video player" frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen></iframe>
                        <div class="track-label">
                            <div style="display: flex; flex-direction: column; gap: 2px;">
                                <span>TRACK ${trackNumber}</span>
                                <strong>${track.title}</strong>
                            </div>
                            <button class="share-btn" onclick="shareTrack('${track.title.replace(/'/g, "\\'")}', '${track.id}')">SHARE</button>
                        </div>
                    </div>
                `;
            }).join('');

            catalogRoot.innerHTML = catalogHtml;

            // Update remaining count
            if (totalCatalogTracks > 0) {
                remainingCountEl.textContent = `Showing ${startIndex + 1}-${endIndex} of ${totalCatalogTracks} tracks`;
            } else {
                remainingCountEl.textContent = 'No more tracks.';
            }


            // 3. Render Pagination Controls
            if (paginationControls) {
                paginationControls.innerHTML = ''; // Clear previous buttons

                if (totalPages > 1) {
                    const prevButton = document.createElement('button');
                    prevButton.textContent = 'Previous';
                    prevButton.classList.add('pagination-button');
                    prevButton.disabled = (currentPage === 1);
                    prevButton.onclick = () => { renderMusic(currentPage - 1); document.querySelector('.section-heading').scrollIntoView({ behavior: 'smooth' }); };
                    paginationControls.appendChild(prevButton);

                    for (let i = 1; i <= totalPages; i++) {
                        const pageButton = document.createElement('button');
                        pageButton.textContent = i;
                        pageButton.classList.add('pagination-button');
                        if (i === currentPage) pageButton.classList.add('active');
                        pageButton.onclick = () => { 
                            renderMusic(i); 
                            document.querySelector('.section-heading').scrollIntoView({ behavior: 'smooth' });
                        };
                        paginationControls.appendChild(pageButton);
                    }

                    const nextButton = document.createElement('button');
                    nextButton.textContent = 'Next';
                    nextButton.classList.add('pagination-button');
                    if (currentPage === totalPages) nextButton.disabled = true;
                    nextButton.onclick = () => { renderMusic(currentPage + 1); document.querySelector('.section-heading').scrollIntoView({ behavior: 'smooth' }); };
                    paginationControls.appendChild(nextButton);
                }
            }
        }

        // ระบบการค้นหา
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        const musicLoader = document.getElementById('music-loader');

        function performSearchAndFilter() {
            // แสดง Loader
            musicLoader.classList.add('active');

            // ใช้ timeout เล็กน้อยเพื่อให้เห็น spinner และจำลองการประมวลผล
            setTimeout(() => {
                const query = searchInput.value.toLowerCase().trim();
                clearBtn.style.display = query.length > 0 ? 'block' : 'none';

                filteredTracks = trackList.filter(track => {
                    const matchesSearch = track.title.toLowerCase().includes(query);
                    const matchesMode = currentMode === 'ALL' || (track.mode && track.mode.toUpperCase() === currentMode);
                    return matchesSearch && matchesMode;
                });

                renderMusic(1);
                
                // ซ่อน Loader
                musicLoader.classList.remove('active');
            }, 400);
        }

        searchInput.addEventListener('input', performSearchAndFilter);

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            performSearchAndFilter();
            searchInput.focus();
        });

        // ระบบการกรองตามโหมด (Category Filter)
        document.getElementById('filter-root').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                // อัปเดตสถานะปุ่ม Active
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');

                currentMode = e.target.getAttribute('data-mode');
                performSearchAndFilter();
            }
        });

        // เรียกใช้ฟังก์ชันเมื่อโหลดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            renderMusic(1);
            loadStats();

            // Mobile Menu Toggle
            const navToggle = document.getElementById('nav-toggle');
            const navMenu = document.getElementById('nav-menu');
            if(navToggle) {
                navToggle.addEventListener('click', () => navMenu.classList.toggle('active'));
            }
        });

        // Page Fade-in
        window.addEventListener('load', () => {
            document.getElementById('page-loader').style.opacity = '0';
        });
    </script>

</body>
</html>
