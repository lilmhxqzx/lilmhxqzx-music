<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilmhxqzx Music - MY MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header::after {
            content: 'MUSIC';
            position: absolute;
            right: -10px; top: 50%;
            transform: translateY(-50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(80px, 14vw, 200px);
            color: transparent;
            -webkit-text-stroke: 1px rgba(232,0,13,0.1);
            pointer-events: none;
            letter-spacing: 10px;
            line-height: 1;
            user-select: none;
        }
        .track-count {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 500px;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: var(--grey);
            font-weight: 600;
            animation: fadeUp 0.7s 0.2s ease both;
        }
        .track-count span { color: var(--red); font-family: 'Share Tech Mono', monospace; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* GRID */
        .music-container {
            padding: 48px 60px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .featured-track {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
            gap: 0;
            margin-bottom: 34px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            animation: fadeUp 0.7s 0.25s ease both;
        }
        .featured-track::before {
            content: '';
            position: absolute;
            inset: 0 0 auto;
            height: 2px;
            background: var(--red);
            z-index: 2;
        }
        .featured-video {
            background: var(--deep);
            aspect-ratio: 16 / 9;
        }
        .featured-video iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .featured-info {
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 28px;
            border-left: 1px solid var(--border);
        }
        .featured-kicker,
        .track-kicker,
        .section-label {
            font-family: 'Share Tech Mono', monospace;
            color: var(--red);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .featured-info h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(44px, 5vw, 72px);
            letter-spacing: 4px;
            line-height: 0.9;
            margin: 12px 0 14px;
        }
        .featured-info p {
            color: var(--grey);
            font-size: 18px;
            line-height: 1.5;
        }
        .featured-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border: 1px solid var(--border);
            background: var(--border);
            gap: 1px;
        }
        .featured-stats div {
            background: var(--deep);
            padding: 13px 14px;
        }
        .featured-stats span {
            display: block;
            color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .featured-stats strong {
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 18px;
            margin: 0 0 18px;
            padding-top: 8px;
        }
        .section-heading h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(34px, 5vw, 58px);
            letter-spacing: 4px;
            line-height: 0.9;
        }
        .section-heading p {
            color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .song-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transition: all 0.25s ease;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }
        .card:nth-child(1)  { animation-delay: 0.05s; }
        .card:nth-child(2)  { animation-delay: 0.10s; }
        .card:nth-child(3)  { animation-delay: 0.15s; }
        .card:nth-child(4)  { animation-delay: 0.20s; }
        .card:nth-child(5)  { animation-delay: 0.25s; }
        .card:nth-child(6)  { animation-delay: 0.30s; }
        .card:nth-child(7)  { animation-delay: 0.35s; }
        .card:nth-child(8)  { animation-delay: 0.40s; }
        .card:nth-child(9)  { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.50s; }
        .card:nth-child(11) { animation-delay: 0.55s; }
        .card:nth-child(12) { animation-delay: 0.60s; }
        .card:nth-child(13) { animation-delay: 0.65s; }
        .card:nth-child(14) { animation-delay: 0.70s; }

        .card:hover {
            border-color: var(--red-dim);
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 32px var(--red-glow);
        }

        /* red top flash on hover */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--red);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
            z-index: 2;
        }
        .card:hover::before { transform: scaleX(1); }

        .card iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: none;
            display: block;
        }
        .track-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: var(--deep);
            border-top: 1px solid var(--border);
        }
        .track-label span {
            color: var(--red);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
        }
        .track-label strong {
            color: var(--grey);
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* FOOTER BAR */
        .footer-bar {
            border-top: 1px solid var(--border);
            padding: 40px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--deep);
        }
        .footer-bar .logo-sm {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 4px;
            color: var(--dim);
        }
        .footer-bar .socials { display: flex; gap: 10px; flex-wrap: wrap; }
        .footer-bar .socials a {
            text-decoration: none;
            color: var(--dim);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 500px;
            transition: all 0.2s;
        }
        .footer-bar .socials a:hover {
            color: var(--white);
            border-color: var(--red);
            box-shadow: 0 0 12px var(--red-glow);
        }

        /* Search Styles */
        .search-container {
            position: relative;
            margin-top: 24px;
            max-width: 400px;
            animation: fadeUp 0.7s 0.3s ease both;
        }

        #search-input {
            width: 100%;
            background: var(--deep);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 45px 14px 20px;
            color: var(--white);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 15px var(--red-glow);
        }

        .clear-search-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--dim);
            font-size: 22px;
            cursor: pointer;
            display: none;
            line-height: 1;
            transition: color 0.2s;
        }
        .clear-search-btn:hover { color: var(--red); }

        /* Filter Styles */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            animation: fadeUp 0.7s 0.35s ease both;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            padding: 6px 16px;
            border-radius: 500px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { border-color: var(--grey); color: var(--grey); }
        .filter-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
        }

        /* Pagination Controls */
        .pagination-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .pagination-button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--grey);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .pagination-button:hover:not(:disabled) {
            border-color: var(--red);
            color: var(--white);
            background: rgba(232, 0, 13, 0.1);
        }

        .pagination-button.active {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
            cursor: default;
        }

        .pagination-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .navbar { padding: 0 20px; }
            .page-header { padding: 48px 24px 32px; }
            .music-container { padding: 32px 20px 60px; }
            .featured-track { grid-template-columns: 1fr; }
            .featured-info { border-left: 0; border-top: 1px solid var(--border); padding: 22px; }
            .section-heading { align-items: start; flex-direction: column; }
            .song-container { grid-template-columns: 1fr; gap: 14px; }
            .footer-bar { padding: 32px 20px; }
        }
        @media (max-width: 480px) {
            .navbar ul { gap: 0; }
            .navbar ul li a { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">LILMHXQZX</a>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="music.html" class="active">MUSIC</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>MY MUSIC</h1>
        <p class="subtitle">HEAVY TRACKS BELOW</p>
        <div class="track-count">TRACKS <span id="total-tracks">0</span></div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="SEARCH TRACKS BY TITLE...">
            <button id="clear-search" class="clear-search-btn" type="button" title="Clear search" aria-label="Clear search">&times;</button>
        </div>
        <div class="filter-container" id="filter-root">
            <button class="filter-btn active" data-mode="ALL">ALL</button>
            <button class="filter-btn" data-mode="HEAVY">HEAVY</button>
            <button class="filter-btn" data-mode="MELODIC">MELODIC</button>
            <button class="filter-btn" data-mode="DARK">DARK</button>
        </div>
    </div>

    <div class="music-container">
        <!-- Featured Track will be injected here -->
        <div id="featured-root"></div>

        <div class="section-heading">
            <div>
                <div class="section-label">FULL CATALOG</div>
                <h2>ALL TRACKS</h2>
            </div>
            <p id="remaining-count">Loading...</p>
        </div>

        <div class="song-container" id="catalog-root">
            <!-- Catalog tracks will be injected here -->
        </div>

        <div id="pagination-controls" class="pagination-controls">
            <!-- Pagination buttons will be injected here -->
        </div>

    </div>

    <div class="footer-bar">
        <div class="logo-sm">LILMHXQZX</div>
        <div class="socials">
            <a href="https://web.facebook.com/suparak.chouyphom" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/lilmhxqzx" target="_blank">Instagram</a>
            <a href="https://www.youtube.com/@LilmhxqzxMusic" target="_blank">YouTube</a>
            <a href="https://www.youtube.com/@LilmhxqzxMusic" target="_blank">TikTok</a>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // ข้อมูล trackList ถูกโหลดมาจากไฟล์ data.js แล้ว
        
        let currentPage = 1;
        const itemsPerPage = 10;
        let filteredTracks = [...trackList]; // เก็บรายการเพลงที่ผ่านการกรองแล้ว

        function renderMusic(page = 1) {
            currentPage = page;
            const featuredRoot = document.getElementById('featured-root');
            const catalogRoot = document.getElementById('catalog-root');
            const totalTracksEl = document.getElementById('total-tracks');
            const remainingCountEl = document.getElementById('remaining-count');
            const paginationControls = document.getElementById('pagination-controls');

            if (!filteredTracks.length) {
                featuredRoot.innerHTML = '';
                catalogRoot.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--dim); font-family: \'Share Tech Mono\';">NO TRACKS FOUND MATCHING YOUR SEARCH.</div>';
                totalTracksEl.textContent = '0';
                remainingCountEl.textContent = '0 results';
                paginationControls.innerHTML = '';
                return;
            }

            // Update Total Count (ตามผลการค้นหา)
            totalTracksEl.textContent = filteredTracks.length;

            // 1. Render Featured Track (เพลงแรกจากรายการที่กรองแล้ว)
            const featured = filteredTracks[0];
            featuredRoot.innerHTML = `
                <section class="featured-track" aria-label="Featured track">
                    <div class="featured-video">
                        <iframe src="https://www.youtube.com/embed/${featured.id}" 
                                title="YouTube video player" frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen></iframe>
                    </div>
                    <div class="featured-info">
                        <div>
                            <div class="featured-kicker">LATEST RELEASE</div>
                            <h2>${featured.title}</h2>
                            <p>${featured.description || 'Check out my newest sound.'}</p>
                        </div>
                        <div class="featured-stats">
                            <div>
                                <span>Status</span>
                                <strong>NEWEST</strong>
                            </div>
                            <div>
                                <span>Mode</span>
                                <strong>${featured.mode || 'Heavy'}</strong>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            // 2. Render Catalog (เพลงที่เหลือ)
            const catalogTracks = filteredTracks.slice(1); 
            const totalCatalogTracks = catalogTracks.length;
            const totalPages = Math.ceil(totalCatalogTracks / itemsPerPage);

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalCatalogTracks); // Ensure endIndex doesn't exceed array length

            const paginatedTracks = catalogTracks.slice(startIndex, endIndex);

            const catalogHtml = paginatedTracks.map((track, index) => {
                // Calculate track number relative to the *entire* catalog, not just the current page
                const actualTrackNumber = startIndex + index + 2; // +1 for 0-indexing, +1 for featured track
                const trackNumber = actualTrackNumber.toString().padStart(2, '0');
                
                return `
                    <div class="card" style="animation-delay: ${0.05 * (index + 1)}s">
                        <iframe src="https://www.youtube.com/embed/${track.id}" 
                                title="YouTube video player" frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen></iframe>
                        <div class="track-label">
                            <span>TRACK ${trackNumber}</span>
                            <strong>${track.title}</strong>
                        </div>
                    </div>
                `;
            }).join('');

            catalogRoot.innerHTML = catalogHtml;

            // Update remaining count
            if (totalCatalogTracks > 0) {
                remainingCountEl.textContent = `Showing ${startIndex + 1}-${endIndex} of ${totalCatalogTracks} tracks`;
            } else {
                remainingCountEl.textContent = 'No more tracks.';
            }


            // 3. Render Pagination Controls
            if (paginationControls) {
                paginationControls.innerHTML = ''; // Clear previous buttons

                if (totalPages > 1) {
                    const prevButton = document.createElement('button');
                    prevButton.textContent = 'Previous';
                    prevButton.classList.add('pagination-button');
                    if (currentPage === 1) prevButton.disabled = true;
                    prevButton.onclick = () => { renderMusic(currentPage - 1); window.scrollTo(0, 0); };
                    paginationControls.appendChild(prevButton);

                    for (let i = 1; i <= totalPages; i++) {
                        const pageButton = document.createElement('button');
                        pageButton.textContent = i;
                        pageButton.classList.add('pagination-button');
                        if (i === currentPage) pageButton.classList.add('active');
                        pageButton.onclick = () => { renderMusic(i); window.scrollTo(0, 0); };
                        paginationControls.appendChild(pageButton);
                    }

                    const nextButton = document.createElement('button');
                    nextButton.textContent = 'Next';
                    nextButton.classList.add('pagination-button');
                    if (currentPage === totalPages) nextButton.disabled = true;
                    nextButton.onclick = () => { renderMusic(currentPage + 1); window.scrollTo(0, 0); };
                    paginationControls.appendChild(nextButton);
                }
            }
        }

        // ระบบการค้นหา
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            // แสดง/ซ่อนปุ่มล้างการค้นหา
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            filteredTracks = trackList.filter(track => 
                track.title.toLowerCase().includes(query)
            );
            renderMusic(1); // กลับไปหน้า 1 เมื่อมีการค้นหาใหม่
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            filteredTracks = [...trackList];
            renderMusic(1);
            searchInput.focus();
        });

        // เรียกใช้ฟังก์ชันเมื่อโหลดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => renderMusic(1));
    </script>

</body>
</html>
